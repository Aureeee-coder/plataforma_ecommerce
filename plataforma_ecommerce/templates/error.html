{% extends "base.html" %}

{% block title %}
Error
{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error en la Operación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="card shadow">
        <div class="card-header bg-danger text-white">
            <h3>Error en la Operación</h3>
        </div>
        <div class="card-body">
            <h1 style="color: red;">Hubo un problema al procesar su solicitud</h1>
            <p>Detalles del error: {{ mensaje }}</p>
            <br>
            <a href="{% url 'inicio' %}" class="btn btn-primary">Reintentar compra</a>
        </div>
    </div>
{% endblock %}
</body>
</html>
